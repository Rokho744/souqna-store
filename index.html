
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سوقنا | SOUQNA</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;color:#222}
header{background:#142d4e;color:white;padding:25px 15px;text-align:center}
header h1{margin:0;font-size:32px}
header p{margin:8px 0 0}
main{max-width:1050px;margin:25px auto;padding:12px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}
.product{background:white;padding:18px;border-radius:12px;text-align:center;box-shadow:0 2px 8px #ddd}
.product .emoji{font-size:55px}
.price{color:#087b48;font-weight:bold;font-size:20px}
button{border:0;border-radius:7px;padding:11px 16px;background:#087b48;color:white;cursor:pointer}
.cart{background:white;padding:18px;margin-top:25px;border-radius:12px}
input,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ccc;border-radius:7px}
footer{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<header>
<h1>🛍️ سوقنا SOUQNA</h1>
<p>مرحبا بكم في متجرنا الإلكتروني</p>
<p>منتجات متنوعة وأثمنة مناسبة والتوصيل عند الاستلام</p>
</header>
<main>
<h2>منتجاتنا</h2>
<div class="products" id="products"></div>
<section class="cart">
<h2>🛒 سلة المشتريات</h2>
<div id="cart">السلة فارغة</div>
<h3 id="total">المجموع: 0 درهم</h3>
<h3>معلومات التوصيل</h3>
<input id="name" placeholder="الاسم الكامل">
<input id="phone" placeholder="رقم الهاتف">
<textarea id="address" placeholder="العنوان والمدينة"></textarea>
<button onclick="order()">تأكيد الطلب عبر WhatsApp</button>
</section>
</main>
<footer>© 2026 SOUQNA - سوقنا</footer>
<script>
const whatsapp="212696374968";
const items=[
["حامل الهاتف للسيارة","59","📱"],
["منظم المنزل","59","🏠"],
["جهاز عرض النجوم","169","🌌"],
["قطاعة الخضر","119","🥕"],
["منظم التوابل","159","🧂"],
["مصباح LED","59","💡"],
["منظم مستحضرات التجميل","109","💄"],
["منظم الحقائب","59","👜"]
];
let basket=[];
const products=document.getElementById("products");
items.forEach((p,i)=>{
products.innerHTML+=`<div class="product">
<div class="emoji">${p[2]}</div>
<h3>${p[0]}</h3>
<p class="price">${p[1]} درهم</p>
<button onclick="add(${i})">أضف إلى السلة</button>
</div>`;
});
function add(i){basket.push(items[i]);showCart();}
function showCart(){
document.getElementById("cart").innerHTML=basket.length?
basket.map(p=>p[0]+" - "+p[1]+" درهم").join("<br>"):"السلة فارغة";
document.getElementById("total").textContent="المجموع: "+basket.reduce((s,p)=>s+Number(p[1]),0)+" درهم";
}
function order(){
if(!basket.length){alert("السلة فارغة");return;}
let n=document.getElementById("name").value.trim();
let ph=document.getElementById("phone").value.trim();
let a=document.getElementById("address").value.trim();
if(!n||!ph||!a){alert("يرجى ملء جميع المعلومات");return;}
let msg="طلب جديد من متجر SOUQNA%0Aالاسم: "+n+"%0Aالهاتف: "+ph+"%0Aالعنوان: "+a+"%0Aالمنتجات:%0A"+basket.map(p=>p[0]+" - "+p[1]+" درهم").join("%0A")+"%0Aالمجموع: "+basket.reduce((s,p)=>s+Number(p[1]),0)+" درهم";
window.open("https://wa.me/"+whatsapp+"?text="+encodeURIComponent(msg)," _blank");
}
</script>
</body>
</html>
